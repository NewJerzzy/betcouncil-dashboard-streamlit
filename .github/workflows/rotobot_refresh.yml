name: RotoBot Refresh

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run RotoBot Scraper
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          pip install requests
          python -c "
import requests, json, os
url = 'https://ardonyjjtwljfzs zhcko.supabase.co/rest/v1/'
key = os.getenv('SUPABASE_SERVICE_ROLE_KEY')
h = {'apikey':key,'Authorization':'Bearer '+key}
data = {}
for t in ['props','model_edges','model_predictions']:
  r = requests.get(url+t, headers=h, params={'limit':300})
  if r.ok: data[t] = r.json()
with open('rotobot_data.json','w') as f: json.dump(data,f)
print('Done')
"

name: RotoBot Refresh

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run RotoBot Scraper
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PICK6_GIST_TOKEN: ${{ secrets.PICK6_GIST_TOKEN }}
        run: |
          pip install requests
          python3 .github/scripts/rotobot_scraper.py

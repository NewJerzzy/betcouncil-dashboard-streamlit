name: RotoBot Refresh

# DISABLED: RotoBot sports picks are auth-gated; Supabase key points to SaaS
# billing DB only. Re-enable by restoring the schedule trigger below.
# Original schedule: "0 */4 * * *"
on:
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run RotoBot Scraper + Push to Gist
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          pip install requests
          python scripts/rotobot_scraper.py

      - name: Commit and push rotobot_data.json
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add rotobot_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m 'Update RotoBot data' && git push)

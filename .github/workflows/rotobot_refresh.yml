name: RotoBot Refresh

on:
  schedule:
    - cron: "0 */4 * * *"   # Every 4 hours (simpler)
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python -c '
import requests, json, os
url = "https://ardonyjjtwljfzs zhcko.supabase.co/rest/v1/"
key = os.getenv("SUPABASE_SERVICE_ROLE_KEY")
h = {"apikey":key,"Authorization":f"Bearer {key}"}
data = {}
for t in ["props","model_edges","model_predictions"]:
  r = requests.get(url+t, headers=h, params={"limit":300})
  if r.ok: data[t] = r.json()
with open("rotobot_data.json","w") as f: json.dump(data,f)
print("Done")
' 
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

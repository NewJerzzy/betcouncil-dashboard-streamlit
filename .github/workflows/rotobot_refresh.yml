name: RotoBot Refresh

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run RotoBot Scraper
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          pip install requests
          python - <<'EOF'
import requests, json, os, sys
key = os.getenv("SUPABASE_SERVICE_ROLE_KEY")
if not key:
    print("ERROR: SUPABASE_SERVICE_ROLE_KEY secret is not set", file=sys.stderr)
    sys.exit(1)
BASE_URL = "https://ardonyjjtwljfszhcko.supabase.co/rest/v1/"
HEADERS = {
    "apikey": key,
    "Authorization": "Bearer " + key,
}
TABLES = ["props", "model_edges", "model_predictions"]
data = {}
for table in TABLES:
    resp = requests.get(BASE_URL + table, headers=HEADERS, params={"limit": 300}, timeout=30)
    if resp.ok:
        data[table] = resp.json()
        print(f"✅ {table}: {len(data[table])} rows")
    else:
        print(f"ERROR: {table} returned HTTP {resp.status_code}: {resp.text[:200]}", file=sys.stderr)
        sys.exit(1)
with open("rotobot_data.json", "w") as f:
    json.dump(data, f, indent=2)
print("rotobot_data.json written successfully")
EOF
      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add rotobot_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m 'Update RotoBot data' && git push)

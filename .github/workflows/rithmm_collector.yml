name: Rithmm Model Picks

on:
  schedule:
    - cron: "10 14 * * *"
    - cron: "10 21 * * *"
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests playwright && playwright install --with-deps chromium
      - name: Collect Rithmm model picks
        env:
          GITHUB_TOKEN: ${{ secrets.PICK6_GIST_TOKEN }}
          RITHMM_LOGIN_EMAIL: ${{ secrets.RITHMM_LOGIN_EMAIL }}
          RITHMM_LOGIN_PASSWORD: ${{ secrets.RITHMM_LOGIN_PASSWORD }}
        run: python scripts/rithmm_collector.py

name: GameLinePicks Refresh

on:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch: {}

jobs:
  refresh-gamelinepicks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: Run GameLinePicks scraper
        env:
          GITHUB_TOKEN: ${{ secrets.PICK6_GIST_TOKEN_2 }}
        run: python scripts/gamelinepicks_refresh.py

name: OddsAPI.io FanDuel Props Refresh

on:
  schedule:
    - cron: "5,20,35,50 * * * *"
  workflow_dispatch: {}

jobs:
  refresh-oddsapiio-fanduel-props:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: Run FanDuel props odds-api.io scraper
        env:
          GITHUB_TOKEN: ${{ secrets.PICK6_GIST_TOKEN }}
          ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
        run: python scripts/oddsapiio_fanduel_props_refresh.py

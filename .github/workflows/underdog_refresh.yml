name: Underdog Props Refresh

on:
  schedule:
   - cron: "3,18,33,48 * * * *"
  workflow_dispatch: {}

jobs:
  refresh-underdog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: Run Underdog scraper
        env:
          GITHUB_TOKEN: ${{ secrets.PICK6_GIST_TOKEN }}
        run: python scripts/underdog_ssr_scraper.py 2>&1 | tee /tmp/underdog_log.txt
        continue-on-error: true
      - name: Upload log artifact
        uses: actions/upload-artifact@v4
        with:
          name: underdog-debug-log
          path: /tmp/underdog_log.txt

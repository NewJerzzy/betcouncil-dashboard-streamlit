name: ScoresAndOdds Refresh

on:
  schedule:
   - cron: "0,30 * * * *"
  workflow_dispatch: {}

jobs:
  refresh-scoresandodds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: Run ScoresAndOdds scraper
        env:
          GITHUB_TOKEN: ${{ secrets.PICK6_GIST_TOKEN }}
        run: python scripts/scoresandodds_refresh.py

name: Third-Party Source Snapshot (for backtesting)

on:
  schedule:
   - cron: "0 12 * * *"
  workflow_dispatch: {}

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Write placeholder secrets for headless import
        run: |
          mkdir -p .streamlit
          cat > .streamlit/secrets.toml << 'EOF'
          GITHUB_TOKEN = "${{ secrets.PICK6_GIST_TOKEN_2 }}"
          GITHUB_GIST_ID = "7e52e1c2c2054847c7c4663a157386c5"
          ODDS_API_KEY = ""
          ODDSPAPI_KEY = ""
          PARLAY_API_KEY = ""
          BALLSDONTLIE_API_KEY = ""
          SCRAPEOPS_KEY = ""
          EOF
      - name: Run snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.PICK6_GIST_TOKEN_2 }}
        run: python scripts/third_party_snapshot.py

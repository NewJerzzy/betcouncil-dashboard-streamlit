name: PropsMadness Refresh

on:
  schedule:
    - cron: "10,25,40,55 * * * *"
  workflow_dispatch: {}

jobs:
  refresh-propsmadness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: Run PropsMadness scraper
        env:
          GITHUB_TOKEN: ${{ secrets.PICK6_GIST_TOKEN }}
        run: python scripts/propsmadness_refresh.py

name: TheOddsGap Edges Refresh

on:
  schedule:
    - cron: "24,54 * * * *"
  workflow_dispatch: {}

jobs:
  refresh-theoddsgap-edges:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: Run theoddsgap edges scraper
        env:
          GITHUB_TOKEN: ${{ secrets.PICK6_GIST_TOKEN_2 }}
        run: python scripts/theoddsgap_edges_refresh.py

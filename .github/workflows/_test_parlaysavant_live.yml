name: _test ParlaySavant Live Check (temporary diagnostic)

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test ParlaySavant direct API
        env:
          GITHUB_TOKEN: ${{ secrets.PICK6_GIST_TOKEN }}
        run: |
          python3 -c "
          import requests, json, os
          try:
              r = requests.get(
                  'https://parlaysavant.com/api/props?sport=mlb&type=positive_ev&limit=100',
                  headers={'Accept': 'application/json',
                           'Referer': 'https://parlaysavant.com/',
                           'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'},
                  timeout=14)
              result = {'status': r.status_code, 'body_snippet': r.text[:500]}
          except Exception as e:
              result = {'error': str(e)}
          print(json.dumps(result, indent=2))
          token = os.environ['GITHUB_TOKEN']
          requests.patch('https://api.github.com/gists/7e52e1c2c2054847c7c4663a157386c5',
              headers={'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json'},
              json={'files': {'_test_parlaysavant_live_result.json': {'content': json.dumps(result, indent=2)}}},
              timeout=15)
          "

name: PrizePicks Props Refresh

on:
  schedule:
    - cron: "6,21,36,51 * * * *"
  workflow_dispatch: {}

jobs:
  refresh-prizepicks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: Run PrizePicks scraper
        env:
          GITHUB_TOKEN: ${{ secrets.PICK6_GIST_TOKEN }}
        run: python scripts/prizepicks_ssr_scraper.py

name: Kalshi MLB Refresh

on:
  workflow_dispatch: {}

jobs:
  refresh-kalshi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: Run Kalshi MLB scraper
        env:
          GITHUB_TOKEN: ${{ secrets.PICK6_GIST_TOKEN_2 }}
        run: python scripts/kalshi_refresh.py

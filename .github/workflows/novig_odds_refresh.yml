name: Novig Odds Refresh

on:
  schedule:
    - cron: "0 11,23 * * *"
  workflow_dispatch: {}

jobs:
  refresh-novig-odds:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: Run Novig odds scraper
        env:
          GITHUB_TOKEN: ${{ secrets.PICK6_GIST_TOKEN_2 }}
          ODDS_API_KEY_NOVIG: ${{ secrets.ODDS_API_KEY_NOVIG }}
        run: python scripts/novig_odds_refresh.py

name: Key Test (temp)

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: Test ODDS_API_KEY validity
        env:
          GITHUB_TOKEN: ${{ secrets.PICK6_GIST_TOKEN_2 }}
          ODDS_API_KEY_TEST: ${{ secrets.ODDS_API_KEY_TEST }}
        run: python scripts/keytest.py

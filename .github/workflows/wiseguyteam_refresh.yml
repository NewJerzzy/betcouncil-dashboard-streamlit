name: WiseGuyTeam Sharp Report Refresh

on:
  schedule:
    - cron: "13,33,53 * * * *"   # offset from :00/:20/:40 -- confirmed contended slot, likely cause of this script's persistent push failures
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: Run WiseGuyTeam sharp report scraper
        env:
          GITHUB_TOKEN: ${{ secrets.PICK6_GIST_TOKEN_2 }}
        run: python scripts/wiseguyteam_refresh.py

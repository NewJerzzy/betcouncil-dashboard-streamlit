name: OddsShark Consensus Refresh

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: DIAGNOSTIC - test raw DNS resolution
        run: |
          DNS1=$(getent hosts www.oddsshark.com 2>&1 | tr '\n' ' ' || echo "getent failed")
          DNS2=$(nslookup www.oddsshark.com 8.8.8.8 2>&1 | tr '\n' ' ')
          GOOGLE=$(curl -s -o /dev/null -w "%{http_code}" https://www.google.com --max-time 10)
          DIRECT=$(curl -s -o /dev/null -w "%{http_code}" https://www.oddsshark.com/mlb/consensus-picks --max-time 10 2>&1)
          echo "::notice title=DNS1::$DNS1"
          echo "::notice title=DNS2 (via 8.8.8.8)::$DNS2"
          echo "::notice title=GoogleTest::$GOOGLE"
          echo "::notice title=DirectCurl::$DIRECT"

name: WagerBird Picks Refresh

on:
  schedule:
    - cron: "30 11 * * *"   # once/day -- source posts a few picks a few times/week, not live data
  workflow_dispatch: {}

jobs:
  refresh-wagerbird:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: Run WagerBird picks scraper (captured to file)
        env:
          GITHUB_TOKEN: ${{ secrets.PICK6_GIST_TOKEN_2 }}
        run: python scripts/wagerbird_refresh.py > /tmp/wb_output.log 2>&1; echo "EXIT_CODE=$?" >> /tmp/wb_output.log; cat /tmp/wb_output.log
        continue-on-error: true
      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wagerbird-diagnostic-log
          path: /tmp/wb_output.log
          retention-days: 1

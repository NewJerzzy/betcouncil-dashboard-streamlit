name: WagerBird Picks Refresh

on:
  schedule:
    - cron: "30 11 * * *"
  workflow_dispatch: {}

jobs:
  refresh-wagerbird:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: Run WagerBird picks scraper
        env:
          GITHUB_TOKEN: ${{ secrets.PICK6_GIST_TOKEN_2 }}
        run: |
          OUTPUT=$(python scripts/wagerbird_refresh.py 2>&1)
          EXIT_CODE=$?
          echo "::notice title=WagerBird Result::EXIT=$EXIT_CODE | $(echo "$OUTPUT" | tr '\n' ' ' | cut -c1-500)"
          exit $EXIT_CODE

name: WagerBird Picks Refresh

on:
  schedule:
    - cron: "30 11 * * *"   # once/day -- source posts a few picks a few times/week, not live data
  workflow_dispatch: {}

jobs:
  refresh-wagerbird:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: DIAGNOSTIC - pure bash Gist write test
        env:
          GITHUB_TOKEN: ${{ secrets.PICK6_GIST_TOKEN_2 }}
        run: |
          HTTP_CODE=$(curl -s -o /tmp/gist_resp.json -w "%{http_code}" -X PATCH \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/gists/7e52e1c2c2054847c7c4663a157386c5" \
            -d '{"files":{"betcouncil_wagerbird_bashtest.json":{"content":"{\"test\": \"bash direct write worked\", \"ts\": \"'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'\"}"}}}')
          echo "HTTP_CODE=$HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "FAILED - response body:"
            cat /tmp/gist_resp.json
            exit 1
          fi
      - name: Run WagerBird picks scraper
        env:
          GITHUB_TOKEN: ${{ secrets.PICK6_GIST_TOKEN_2 }}
        run: python scripts/wagerbird_refresh.py

name: WagerBird Picks Refresh

on:
  schedule:
    - cron: "30 11 * * *"   # once/day -- source posts a few picks a few times/week, not live data
  workflow_dispatch: {}

jobs:
  refresh-wagerbird:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: DIAGNOSTIC - verify token is populated
        env:
          GITHUB_TOKEN: ${{ secrets.PICK6_GIST_TOKEN_2 }}
        run: |
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "TOKEN IS EMPTY"
            exit 1
          else
            echo "TOKEN IS SET, length=${#GITHUB_TOKEN}"
          fi
      - name: DIAGNOSTIC - test real network reachability
        run: |
          curl -s -o /dev/null -w "wagerbird.com HTTP %{http_code}\n" --max-time 15 https://wagerbird.com/picks || echo "CURL FAILED (exit $?)"
      - name: Run WagerBird picks scraper
        env:
          GITHUB_TOKEN: ${{ secrets.PICK6_GIST_TOKEN_2 }}
        run: python scripts/wagerbird_refresh.py

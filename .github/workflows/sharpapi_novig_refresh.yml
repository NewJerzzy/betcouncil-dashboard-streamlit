name: SharpAPI Novig Refresh

on:
  workflow_dispatch: {}

jobs:
  refresh-sharpapi-novig:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: Run SharpAPI Novig scraper
        env:
          GITHUB_TOKEN: ${{ secrets.PICK6_GIST_TOKEN_2 }}
          SHARPAPI_KEY: ${{ secrets.SHARPAPI_KEY }}
        run: python scripts/sharpapi_novig_refresh.py

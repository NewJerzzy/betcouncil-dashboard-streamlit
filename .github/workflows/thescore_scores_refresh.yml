name: TheScore Public API Refresh

on:
  schedule:
    - cron: "0,15,30,45 * * * *"
  workflow_dispatch: {}

jobs:
  refresh-thescore-scores:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: Run theScore public API scraper
        env:
          GITHUB_TOKEN: ${{ secrets.PICK6_GIST_TOKEN }}
        run: python scripts/thescore_scores_refresh.py

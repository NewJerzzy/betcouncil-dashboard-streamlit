name: AreYouWatchingThis Refresh

on:
  schedule:
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch: {}

jobs:
  refresh-ayw:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: Run areyouwatchingthis scraper
        env:
          GITHUB_TOKEN: ${{ secrets.PICK6_GIST_TOKEN }}
        run: python scripts/areyouwatchingthis_refresh.py

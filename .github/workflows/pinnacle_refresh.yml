name: Pinnacle Refresh

on:
  schedule:
    - cron: "5,20,35,50 * * * *"
  workflow_dispatch: {}

jobs:
  refresh-pinnacle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: Run Pinnacle scraper
        env:
          GITHUB_TOKEN: ${{ secrets.PICK6_GIST_TOKEN_2 }}
        run: python scripts/pinnacle_refresh.py

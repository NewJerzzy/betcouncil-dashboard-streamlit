name: Pinnacle Refresh

on:
  schedule:
    - cron: "1,16,31,46 * * * *"
  workflow_dispatch: {}

jobs:
  refresh-pinnacle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: Run Pinnacle scraper
        id: run_scraper
        env:
          GITHUB_TOKEN: ${{ secrets.PICK6_GIST_TOKEN }}
        run: |
          set +e
          python -u scripts/pinnacle_refresh.py
          ec=$?
          echo "exit_code=$ec" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Fail job if scraper failed
        if: steps.run_scraper.outputs.exit_code != '0'
        run: exit 1

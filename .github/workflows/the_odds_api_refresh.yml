name: The Odds API Props Refresh

on:
  # Schedule disabled 2026-07-17: the first live test (before markets were
  # trimmed) cost ~26 credits/event and burned the account down to 3
  # credits remaining out of 500 for the month. Re-enable only after
  # confirming the monthly reset date and deciding a per-day credit budget
  # up front, not after the fact.
  # schedule:
  #   - cron: "20 * * * *"
  workflow_dispatch: {}

jobs:
  refresh-odds-api-props:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: Run The Odds API props scraper
        env:
          GITHUB_TOKEN: ${{ secrets.PICK6_GIST_TOKEN }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/the_odds_api_refresh.py

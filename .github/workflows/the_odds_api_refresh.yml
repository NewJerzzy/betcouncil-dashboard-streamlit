name: The Odds API Props Refresh

on:
  # Re-enabled 2026-07-17 despite the account sitting at 3/500 credits
  # remaining -- the script already handles a non-200 /odds response as a
  # no-op (logs and skips, no crash), so a scheduled run costs nothing
  # extra while the budget is exhausted. Resets 1st of each month at
  # 00:00 UTC; the very next scheduled run after that just starts working
  # again on its own -- left ON specifically so nobody has to remember to
  # flip it back.
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch: {}

jobs:
  refresh-odds-api-props:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: Run The Odds API props scraper
        env:
          GITHUB_TOKEN: ${{ secrets.PICK6_GIST_TOKEN }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/the_odds_api_refresh.py

name: The Odds API Props Refresh

on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch: {}

jobs:
  refresh-odds-api-props:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: Run The Odds API props scraper
        env:
          GITHUB_TOKEN: ${{ secrets.PICK6_GIST_TOKEN }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/the_odds_api_refresh.py

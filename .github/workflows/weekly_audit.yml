name: Weekly Self-Audit

on:
  schedule:
    # Every Monday 09:00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (full history for git blame)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # config.py imports st.secrets at module load time; most of these are
      # unused placeholders so `import fetchers` doesn't blow up in a
      # headless runner. SHARPAPI_KEY and PARLAY_API_KEY are the real
      # exceptions -- the live data-quality check genuinely calls real
      # functions with them, so they need to be real, working keys here.
      - name: Write placeholder secrets for headless import
        run: |
          mkdir -p .streamlit
          cat > .streamlit/secrets.toml << 'EOF'
          GITHUB_TOKEN = "${{ secrets.PICK6_GIST_TOKEN_2 }}"
          GITHUB_GIST_ID = "7e52e1c2c2054847c7c4663a157386c5"
          ODDS_API_KEY = ""
          ODDSPAPI_KEY = ""
          PARLAY_API_KEY = "${{ secrets.PARLAY_API_KEY }}"
          BALLSDONTLIE_API_KEY = ""
          SCRAPEOPS_KEY = ""
          SHARPAPI_KEY = "${{ secrets.SHARPAPI_KEY }}"
          EOF

      - name: Run weekly audit
        env:
          GITHUB_TOKEN: ${{ secrets.PICK6_GIST_TOKEN_2 }}
        run: python scripts/weekly_audit.py

name: BDL MLB Access Test (diagnostic)

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test real MLB access with existing key
        env:
          BDL_KEY: ${{ secrets.BDL_API_KEY }}
        run: |
          set +e
          CODE=$(curl -s -o /tmp/resp.json -w "%{http_code}" "https://api.balldontlie.io/mlb/v1/games?dates[]=2026-07-28" -H "Authorization: $BDL_KEY")
          BODY=$(cat /tmp/resp.json | head -c 500)
          echo "::notice title=StatusCode::HTTP $CODE"
          echo "::notice title=Body::$BODY"

name: LineStar Data Refresh

on:
  schedule:
    - cron: "0 * * * *"   # top of every hour
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run LineStar harvester
        env:
          GITHUB_TOKEN: ${{ secrets.PICK6_GIST_TOKEN }}
        run: python scripts/linestar_harvester.py

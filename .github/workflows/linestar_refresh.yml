name: LineStar Data Refresh

on:
  schedule:
    - cron: "38 * * * *"   # offset from top-of-hour -- confirmed :00 is the most contended slot (shared by 7+ other workflows), likely cause of intermittent push failures despite the code itself working cleanly
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run LineStar harvester
        env:
          GITHUB_TOKEN: ${{ secrets.PICK6_GIST_TOKEN_2 }}
        run: python scripts/linestar_harvester.py

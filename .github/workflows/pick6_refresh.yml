name: DK Pick6 Refresh

on:
  schedule:
   - cron: "15,45 * * * *"
  workflow_dispatch: {}

jobs:
  refresh-pick6:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: Run Pick6 scraper
        env:
          GITHUB_TOKEN: ${{ secrets.PICK6_GIST_TOKEN_2 }}
          DK_EMAIL: ${{ secrets.DK_EMAIL }}
          DK_PASSWORD: ${{ secrets.DK_PASSWORD }}
        run: python scripts/pick6_refresh.py

name: Headless NFL Run (one-off)

on:
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt || true
      - name: Build secrets.toml
        run: |
          mkdir -p .streamlit
          cat > .streamlit/secrets.toml << EOF2
          GITHUB_TOKEN = "${{ secrets.PICK6_GIST_TOKEN }}"
          GITHUB_GIST_ID = "7e52e1c2c2054847c7c4663a157386c5"
          SHARPAPI_KEY = "${{ secrets.SHARPAPI_KEY }}"
          SHARPAPI_KEY_2 = "${{ secrets.SHARPAPI_KEY_2 }}"
          PARLAY_API_KEY = "${{ secrets.PARLAY_API_KEY }}"
          EV_JWT = "${{ secrets.EV_JWT }}"
          ODDS_API_KEY = "${{ secrets.ODDS_API_KEY }}"
          EOF2
      - name: Run
        env:
          GITHUB_TOKEN: ${{ secrets.PICK6_GIST_TOKEN }}
        run: python scripts/headless_nfl_run.py

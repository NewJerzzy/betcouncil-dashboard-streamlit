name: Auto Scraper Refresh (DK/BetMGM/Novig/Betr)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run scraper (no-auth books only — PrizePicks/Underdog already covered by their own workflows)
        id: run_scraper
        env:
          GITHUB_TOKEN: ${{ secrets.PICK6_GIST_TOKEN }}
          PYTHONUNBUFFERED: "1"
          PYTHONFAULTHANDLER: "1"
        run: |
          set +e
          echo "=== SANITY CHECK: script started ===" > /tmp/scraper_output.log
          echo "PWD: $(pwd)" >> /tmp/scraper_output.log
          echo "Python: $(which python) $(python --version 2>&1)" >> /tmp/scraper_output.log
          ls -la betcouncil_auto_scraper.py >> /tmp/scraper_output.log 2>&1
          echo "=== Running scraper now ===" >> /tmp/scraper_output.log
          python -u betcouncil_auto_scraper.py --all --books dk,mgm,novig,betr >> /tmp/scraper_output.log 2>&1
          ec=$?
          echo "=== EXIT CODE: $ec ===" >> /tmp/scraper_output.log
          wc -l /tmp/scraper_output.log
          cat /tmp/scraper_output.log
          echo "exit_code=$ec" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Push debug log to Gist
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.PICK6_GIST_TOKEN }}
        run: python scripts/push_scraper_debug_log.py /tmp/scraper_output.log

      - name: Fail job if scraper failed
        if: steps.run_scraper.outputs.exit_code != '0'
        run: exit 1

name: Signal Odds Refresh

on:
  schedule:
    - cron: "10,40 * * * *"
  workflow_dispatch: {}

jobs:
  refresh-signalodds:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: Run Signal Odds scraper
        env:
          GITHUB_TOKEN: ${{ secrets.PICK6_GIST_TOKEN_2 }}
          SIGNAL_ODDS_JWT: ${{ secrets.SIGNAL_ODDS_JWT }}
        run: python scripts/signalodds_refresh.py

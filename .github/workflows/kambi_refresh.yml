name: Kambi Refresh

on:
  schedule:
    - cron: "10,25,40,55 * * * *"
  workflow_dispatch: {}

jobs:
  refresh-kambi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: Run Kambi scraper
        env:
          GITHUB_TOKEN: ${{ secrets.PICK6_GIST_TOKEN }}
        run: python scripts/kambi_refresh.py

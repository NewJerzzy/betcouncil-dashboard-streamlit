name: Gist Self-Cleanup

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: Run real self-cleanup
        env:
          GITHUB_TOKEN: ${{ secrets.PICK6_GIST_TOKEN }}
        run: python scripts/gist_self_cleanup.py

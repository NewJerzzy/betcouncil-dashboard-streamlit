name: WGT Golf Tennis Test (diagnostic)

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test golf and tennis sport params directly
        run: |
          GOLF=$(curl -s "https://inngest-worker.memberservice.workers.dev/sharp-report?sport=golf" | head -c 300 | tr '\n' ' ')
          TENNIS=$(curl -s "https://inngest-worker.memberservice.workers.dev/sharp-report?sport=tennis" | head -c 300 | tr '\n' ' ')
          PGA=$(curl -s "https://inngest-worker.memberservice.workers.dev/sharp-report?sport=pga" | head -c 200 | tr '\n' ' ')
          ATP=$(curl -s "https://inngest-worker.memberservice.workers.dev/sharp-report?sport=atp" | head -c 200 | tr '\n' ' ')
          echo "::notice title=GOLF::$GOLF"
          echo "::notice title=TENNIS::$TENNIS"
          echo "::notice title=PGA::$PGA"
          echo "::notice title=ATP::$ATP"

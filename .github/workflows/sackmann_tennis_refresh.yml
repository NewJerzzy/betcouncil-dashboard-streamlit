name: Sackmann Tennis Stats Refresh

on:
  schedule:
    - cron: "20 8 * * *"
  workflow_dispatch: {}

jobs:
  refresh-sackmann-tennis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: Run Sackmann tennis stats scraper
        env:
          GITHUB_TOKEN: ${{ secrets.PICK6_GIST_TOKEN }}
        run: python scripts/sackmann_tennis_refresh.py

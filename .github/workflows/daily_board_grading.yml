name: Daily Board Grading

on:
  schedule:
    # 11:00 UTC daily — after prior day's US games are final
    - cron: "0 11 * * *"
  workflow_dispatch: {}

jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write placeholder secrets for headless import
        run: |
          mkdir -p .streamlit
          cat > .streamlit/secrets.toml << 'EOF'
          GITHUB_TOKEN = "${{ secrets.PICK6_GIST_TOKEN }}"
          GITHUB_GIST_ID = "7e52e1c2c2054847c7c4663a157386c5"
          ODDS_API_KEY = ""
          ODDSPAPI_KEY = ""
          PARLAY_API_KEY = ""
          BALLSDONTLIE_API_KEY = ""
          SCRAPEOPS_KEY = ""
          EOF

      - name: Grade yesterday's board
        env:
          GITHUB_TOKEN: ${{ secrets.PICK6_GIST_TOKEN }}
        run: python scripts/daily_board_grading.py

name: RotoGrinders Lineups Refresh

on:
  schedule:
   - cron: "20,50 * * * *"
  workflow_dispatch: {}

jobs:
  refresh-rotogrinders:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: Run RotoGrinders scraper
        env:
          GITHUB_TOKEN: ${{ secrets.PICK6_GIST_TOKEN }}
        run: python scripts/rotogrinders_refresh.py

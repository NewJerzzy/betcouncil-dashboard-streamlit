name: Dimers Refresh (via Stats Insider backend)

on:
  schedule:
   - cron: "20,50 * * * *"
  workflow_dispatch: {}

jobs:
  refresh-dimers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: Run Dimers scraper
        env:
          GITHUB_TOKEN: ${{ secrets.PICK6_GIST_TOKEN }}
        run: python scripts/dimers_refresh.py

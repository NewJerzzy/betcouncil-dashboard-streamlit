name: LineTerminal Refresh

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  refresh-lineterminal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: Run LineTerminal scraper
        id: run_scraper
        env:
          GITHUB_TOKEN: ${{ secrets.PICK6_GIST_TOKEN_2 }}
          PYTHONUNBUFFERED: "1"
        run: |
          set +e
          python -u scripts/lineterminal_refresh.py
          ec=$?
          echo "exit_code=$ec" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Fail job if scraper failed
        if: steps.run_scraper.outputs.exit_code != '0'
        run: exit 1

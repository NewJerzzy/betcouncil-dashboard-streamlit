name: "Test: Soccer Data Source Accessibility"

on:
  workflow_dispatch:

jobs:
  test-soccer-sources:
    runs-on: ubuntu-latest
    steps:
      - name: Install curl_cffi
        run: pip install curl_cffi --quiet

      - name: "Sofascore (Chrome TLS impersonation)"
        run: |
          python3 << 'EOF'
          from curl_cffi import requests
          BASE = "https://api.sofascore.com/api/v1"
          r = requests.get(BASE + "/sport/football/scheduled-events/2026-07-09",
                           impersonate="chrome", timeout=12)
          print(f"Sofascore scheduled-events: HTTP {r.status_code}")
          if r.status_code == 200:
              events = r.json().get("events", [])
              print(f"  Events: {len(events)}")
              if events:
                  ev_id = events[0]["id"]
                  r2 = requests.get(BASE + f"/event/{ev_id}/shotmap",
                                    impersonate="chrome", timeout=12)
                  print(f"  Shotmap: HTTP {r2.status_code}")
                  if r2.status_code == 200:
                      shots = r2.json().get("shotmap", [])
                      print(f"  Shots with xG: {len(shots)}")
                      if shots:
                          s = shots[0]
                          print(f"  Sample: xg={s.get('xg')} player={s.get('player',{}).get('name')}")
          elif r.status_code == 403:
              print("  BLOCKED (403) -- GitHub runner IP also datacenter-blocked by Sofascore")
          EOF

      - name: "Understat player JSON blobs"
        run: |
          python3 << 'EOF'
          import urllib.request, re
          req = urllib.request.Request(
              "https://understat.com/player/1250",
              headers={"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)",
                       "Accept": "*/*", "Referer": "https://understat.com/"})
          try:
              with urllib.request.urlopen(req, timeout=15) as r:
                  html = r.read().decode("utf-8", errors="replace")
              found = bool(re.search(r"shotsData\s*=\s*JSON\.parse", html))
              print(f"Understat page: HTTP 200  shotsData_blob={found}")
              if found:
                  m = re.search(r"shotsData\s*=\s*JSON\.parse\('(.+?)'\)", html)
                  if m:
                      import json
                      data = json.loads(m.group(1).encode().decode("unicode_escape"))
                      print(f"  Shots available: {len(data)}")
          except Exception as e:
              print(f"Understat error: {e}")
          EOF

      - name: "FBref (Chrome TLS impersonation)"
        run: |
          python3 << 'EOF'
          from curl_cffi import requests
          r = requests.get("https://fbref.com/en/players/e46012d2/Erling-Haaland",
                           impersonate="chrome", timeout=15)
          print(f"FBref Haaland: HTTP {r.status_code}")
          if r.status_code == 200:
              import re
              xg_found = bool(re.search(r"expected_goals", r.text))
              print(f"  xG data present: {xg_found}  page_size={len(r.text)}")
          EOF

      - name: "Fotmob matches"
        run: |
          python3 << 'EOF'
          from curl_cffi import requests
          r = requests.get("https://www.fotmob.com/api/matches?date=20260709",
                           impersonate="chrome", timeout=12)
          print(f"Fotmob: HTTP {r.status_code}")
          if r.status_code == 200:
              leagues = r.json().get("leagues", [])
              print(f"  Leagues with matches: {len(leagues)}")
              if leagues:
                  mid = leagues[0].get("matches", [{}])[0].get("id")
                  if mid:
                      r2 = requests.get(f"https://www.fotmob.com/api/matchDetails?matchId={mid}",
                                        impersonate="chrome", timeout=12)
                      print(f"  MatchDetails: HTTP {r2.status_code}")
          EOF

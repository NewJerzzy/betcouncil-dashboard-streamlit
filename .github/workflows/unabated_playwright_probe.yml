name: Unabated Playwright Probe (diagnostic)

on:
  workflow_dispatch: {}

jobs:
  probe-unabated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install requests playwright
          playwright install --with-deps chromium
      - name: Run Unabated Playwright probe
        id: run_probe
        env:
          GITHUB_TOKEN: ${{ secrets.PICK6_GIST_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          set +e
          python -u scripts/unabated_playwright_probe.py
          ec=$?
          echo "exit_code=$ec" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Fail job if probe found nothing
        if: steps.run_probe.outputs.exit_code != '0'
        run: exit 1

name: Sackmann Test (temp)

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: Run real script, capture output
        env:
          GITHUB_TOKEN: ${{ secrets.PICK6_GIST_TOKEN }}
        run: |
          set +e
          python -u scripts/sackmann_tennis_refresh.py > /tmp/out.log 2>&1
          echo "EXIT_CODE=$?" >> /tmp/out.log
          python scripts/sackmann_capture.py

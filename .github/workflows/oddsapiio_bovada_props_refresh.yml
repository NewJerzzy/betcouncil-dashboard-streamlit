name: OddsAPI.io Bovada Props Refresh

on:
  schedule:
    - cron: "10,25,40,55 * * * *"
  workflow_dispatch: {}

jobs:
  refresh-oddsapiio-bovada-props:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: Run Bovada props odds-api.io scraper
        env:
          GITHUB_TOKEN: ${{ secrets.PICK6_GIST_TOKEN }}
          ODDS_API_IO_KEY_BOVADA: ${{ secrets.ODDS_API_IO_KEY_BOVADA }}
        run: python scripts/oddsapiio_bovada_props_refresh.py
